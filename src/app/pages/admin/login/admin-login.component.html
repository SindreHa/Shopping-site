<div class="flex justify-center">
    <div class="bg-white p-8 rounded-lg shadow w-full max-w-sm border-t-3 border-blue-700">
        <h1 class="text-2xl font-semibold mb-1">Admin sign in</h1>
        <p class="text-gray-500 text-sm mb-6">Manage products and watch orders live.</p>

        @if (errorMessage$(); as errorMessage) {
            <p class="mb-4 rounded bg-red-50 text-red-700 px-3 py-2 text-sm" role="alert">
                {{ errorMessage }}
            </p>
        }

        <form (submit)="onSubmit($event)" novalidate>
            <label class="block text-sm font-medium mb-4">
                Username
                <input
                    [formField]="loginForm.username"
                    autocomplete="username"
                    class="mt-1 w-full border rounded px-3 py-2"
                />
                @if (loginForm.username().touched() && loginForm.username().invalid()) {
                    <span class="text-red-700 text-xs">{{
                        loginForm.username().errors()[0].message
                    }}</span>
                }
            </label>

            <label class="block text-sm font-medium mb-6">
                Password
                <input
                    [formField]="loginForm.password"
                    type="password"
                    autocomplete="current-password"
                    class="mt-1 w-full border rounded px-3 py-2"
                />
                @if (loginForm.password().touched() && loginForm.password().invalid()) {
                    <span class="text-red-700 text-xs">{{
                        loginForm.password().errors()[0].message
                    }}</span>
                }
            </label>

            <button appCommonButton type="submit" class="w-full" [disabled]="isSubmitting$()">
                {{ isSubmitting$() ? 'Signing in...' : 'Sign in' }}
            </button>
        </form>
    </div>
</div>
