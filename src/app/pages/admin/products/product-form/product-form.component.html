<form
    (submit)="onSubmit($event)"
    novalidate
    class="bg-white rounded-lg border-2 border-blue-200 p-5 mb-6 grid gap-4 sm:grid-cols-2"
>
    <h2 class="sm:col-span-2 text-xl font-semibold">
        {{ product() ? 'Edit ' + product()!.name : 'New product' }}
    </h2>

    <label class="block text-sm font-medium sm:col-span-2">
        Name
        <input [formField]="productForm.name" class="mt-1 w-full border rounded px-3 py-2" />
        @if (productForm.name().touched() && productForm.name().invalid()) {
            <span class="text-red-700 text-xs">{{ productForm.name().errors()[0].message }}</span>
        }
    </label>

    <label class="block text-sm font-medium sm:col-span-2">
        Description
        <textarea
            [formField]="productForm.description"
            rows="3"
            class="mt-1 w-full border rounded px-3 py-2"
        ></textarea>
        @if (productForm.description().invalid()) {
            <span class="text-red-700 text-xs">{{
                productForm.description().errors()[0].message
            }}</span>
        }
    </label>

    <label class="block text-sm font-medium">
        Price
        <input
            [formField]="productForm.price"
            type="number"
            step="0.01"
            class="mt-1 w-full border rounded px-3 py-2"
        />
        @if (productForm.price().touched() && productForm.price().invalid()) {
            <span class="text-red-700 text-xs">{{ productForm.price().errors()[0].message }}</span>
        }
    </label>

    <label class="block text-sm font-medium">
        Stock
        <input
            [formField]="productForm.stock"
            type="number"
            step="1"
            class="mt-1 w-full border rounded px-3 py-2"
        />
        @if (productForm.stock().touched() && productForm.stock().invalid()) {
            <span class="text-red-700 text-xs">{{ productForm.stock().errors()[0].message }}</span>
        }
    </label>

    <div class="sm:col-span-2 flex justify-end gap-2">
        <button appCommonButton type="button" variant="SUBTLE" (click)="cancelEdit.emit()">
            Cancel
        </button>
        <button appCommonButton type="submit" [disabled]="saving()">
            {{ saving() ? 'Saving...' : product() ? 'Save changes' : 'Create product' }}
        </button>
    </div>
</form>
