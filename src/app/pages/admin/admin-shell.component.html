<div class="flex items-end justify-between gap-4 flex-wrap mb-8">
    <div>
        <h1 class="text-3xl">Admin</h1>
        <p class="text-gray-500 text-sm mt-1 flex items-center gap-2">
            Signed in as <span class="font-semibold">{{ username$() }}</span>
            <span
                class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs"
                [class.bg-green-100]="isAdminChannel$()"
                [class.text-green-800]="isAdminChannel$()"
                [class.bg-gray-200]="!isAdminChannel$()"
            >
                <span
                    class="h-2 w-2 rounded-full"
                    [class.bg-green-500]="isAdminChannel$()"
                    [class.animate-pulse]="isAdminChannel$()"
                    [class.bg-gray-400]="!isAdminChannel$()"
                ></span>
                {{ isAdminChannel$() ? 'Live' : 'Offline' }}
            </span>
        </p>
    </div>

    <nav class="flex gap-2" aria-label="Admin">
        @for (link of links; track link.url) {
            <a
                appCommonButton
                routerLinkActive
                #active="routerLinkActive"
                ariaCurrentWhenActive="page"
                [routerLink]="link.url"
                [variant]="active.isActive ? 'PROMINENT' : 'SUBTLE'"
            >
                {{ link.title }}
            </a>
        }
    </nav>
</div>

<router-outlet />
