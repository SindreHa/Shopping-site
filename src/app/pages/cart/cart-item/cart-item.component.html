<div class="flex text-right pl-3 sm:pl-5 sm:pr-1" [class]="componentClasses()">
    <p class="py-4 flex-1 font-medium whitespace-nowrap text-left overflow-hidden text-ellipsis">
        {{ item().product.name }}
    </p>
    <div class="py-4 w-22 text-center">
        <button
            [disabled]="item().quantity <= 1"
            [attr.aria-label]="'Decrease quantity of ' + item().product.name"
            (click)="adjustQuantity.emit(-1)"
            class="px-2 rounded-l text-gray-800 bg-gray-300 cursor-pointer enabled:hover:bg-blue-600 enabled:hover:text-white disabled:bg-gray-200 disabled:cursor-default"
        >
            -
        </button>
        <p class="inline-block px-2">{{ item().quantity }}</p>
        <button
            [disabled]="item().quantity >= item().product.stock"
            [attr.aria-label]="'Increase quantity of ' + item().product.name"
            (click)="adjustQuantity.emit(1)"
            class="px-2 rounded-r text-gray-800 bg-gray-300 cursor-pointer enabled:hover:bg-blue-600 enabled:hover:text-white disabled:bg-gray-200 disabled:cursor-default"
        >
            +
        </button>
    </div>
    <p class="py-4 w-22">
        {{ item().product.price | currency }}
    </p>
    <p class="py-4 w-22 hidden sm:block">
        {{ itemTotal$() | currency }}
    </p>
    <p class="py-4 w-10 text-center">
        <button
            (click)="remove.emit()"
            [attr.aria-label]="'Remove ' + item().product.name + ' from cart'"
            class="h-full w-full block cursor-pointer text-md text-red-600 hover:text-red-800 font-bold"
        >
            &times;
        </button>
    </p>
</div>
