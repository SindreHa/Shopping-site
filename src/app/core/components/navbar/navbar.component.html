<nav
    class="flex justify-center bg-white py-4 px-6 md:px-18 sm:px-10 shadow border-t-3 border-blue-700"
>
    <div
        class="flex max-w-350 w-full items-center justify-center sm:justify-between gap-8 flex-wrap"
    >
        <h1 class="font-semibold text-3xl text-center sm:text-left">Shopping site</h1>

        <div class="menu flex-grow flex items-end sm:items-center w-auto">
            <div class="text-md font-bold text-blue-700 flex-grow flex gap-2">
                @for (item of navItems$(); track item.id) {
                    <a
                        routerLinkActive
                        #activeRoute="routerLinkActive"
                        ariaCurrentWhenActive="page"
                        appCommonButton
                        [variant]="activeRoute.isActive ? 'PROMINENT' : 'SUBTLE'"
                        [routerLink]="item.url"
                    >
                        {{ item.title }}
                    </a>
                }
            </div>

            <div class="flex items-center gap-3">
                <span
                    class="flex items-center gap-1.5 text-xs text-gray-500 whitespace-nowrap"
                    role="status"
                    [attr.title]="isConnected$() ? 'Live updates on' : 'Reconnecting...'"
                >
                    <span
                        class="h-2 w-2 rounded-full"
                        [class.bg-green-500]="isConnected$()"
                        [class.bg-gray-300]="!isConnected$()"
                    ></span>
                    @if (online$(); as online) {
                        {{ online }} {{ online === 1 ? 'shopper' : 'shoppers' }} online
                    } @else {
                        offline
                    }
                </span>

                @if (isAdmin$()) {
                    <button appCommonButton variant="SUBTLE" (click)="signOut()">Sign out</button>
                } @else {
                    <a appCommonButton variant="SUBTLE" routerLink="/admin/login">Sign in</a>
                }
            </div>
        </div>
    </div>
</nav>
